[project]
name = "dash0-kb-sync"
version = "0.1.0"
description = "Automated daily Dash0 knowledge base extractor, Markdown compiler, and in-place Google Docs sync pipeline for NotebookLM and Gemini Gems."
readme = "README.md"
authors = [
    { name = "@derrypete", email = "353690710+derrypete@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "playwright>=1.65.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
dash0-kb-sync = "dash0_kb_sync.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
